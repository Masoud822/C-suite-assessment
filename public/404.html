<!DOCTYPE html>
<html>
  <head>
    <meta charset="utf-8">
    <title>Sarah Safaa - C-Suite English Assessment</title>
    <script type="text/javascript">
      // Clean redirect for GitHub Pages to HashRouter
      var path = window.location.pathname;
      var segments = path.split('/').filter(Boolean);
      var repo = segments[0] || 'C-suite-assessment';
      var subPath = segments.slice(1).join('/');
      var target = window.location.origin + '/' + repo + '/#/' + subPath + (window.location.search || '') + (window.location.hash || '');
      window.location.replace(target);
    </script>
  </head>
  <body>
  </body>
</html>
